name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  linux:
    name: Build Linux release packages
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install toolchain and libraries
        run: |
          pacman -Syu --noconfirm git rustup vulkan-icd-loader libxkbcommon libxkbcommon-x11 libxcb wayland fontconfig freetype2 openssl pkgconf xdg-desktop-portal chromium sudo
          rustup default stable
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Check that the tag matches Cargo.toml
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          CARGO=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          echo "tag=$TAG cargo=$CARGO"
          [ "$TAG" = "$CARGO" ] || { echo "Tag v$TAG does not match Cargo.toml version $CARGO"; exit 1; }
          echo "VERSION=$TAG" >> "$GITHUB_ENV"
      # Releases carry Last Refuge's Google-verified OAuth client, so Gmail sign-in works without a
      # Google Cloud project of the user's own. The id and the desktop client's secret (which Google
      # documents as non-confidential) come from the repository's Actions secrets, not the source.
      - name: Check that the Google sign-in secrets are set
        env:
          OVERLOOK_GOOGLE_CLIENT_ID: ${{ secrets.OVERLOOK_GOOGLE_CLIENT_ID }}
          OVERLOOK_GOOGLE_CLIENT_SECRET: ${{ secrets.OVERLOOK_GOOGLE_CLIENT_SECRET }}
        run: |
          [ -n "$OVERLOOK_GOOGLE_CLIENT_ID" ] && [ -n "$OVERLOOK_GOOGLE_CLIENT_SECRET" ] || {
            echo "Set the OVERLOOK_GOOGLE_CLIENT_ID and OVERLOOK_GOOGLE_CLIENT_SECRET repository secrets; without them the release can't sign in to Gmail."
            exit 1
          }
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # A release never ships with a known-vulnerable Rust dependency. The report is
      # published with the release as evidence of the scan.
      - name: Dependency audit (RustSec)
        run: |
          mkdir -p dist
          cargo audit --json > dist/cargo-audit.json || true
          cargo audit
      - uses: Swatinem/rust-cache@v2
      - name: Build release binary
        env:
          OVERLOOK_GOOGLE_CLIENT_ID: ${{ secrets.OVERLOOK_GOOGLE_CLIENT_ID }}
          OVERLOOK_GOOGLE_CLIENT_SECRET: ${{ secrets.OVERLOOK_GOOGLE_CLIENT_SECRET }}
        run: |
          cargo build --release --locked -p overlook
          bash scripts/check-release-binary.sh target/release/overlook
      - name: Build the pacman package
        run: |
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          mkdir -p /tmp/pkg && cp packaging/PKGBUILD /tmp/pkg/
          cp -r "$GITHUB_WORKSPACE" /tmp/src && chown -R builder /tmp/pkg /tmp/src
          # Reuse the compiled target directory so makepkg does not rebuild from scratch.
          sudo -u builder env OVERLOOK_SRC=/tmp/src CARGO_HOME=/home/builder/.cargo RUSTUP_HOME=/root/.rustup PATH="/root/.cargo/bin:$PATH" bash -c 'cd /tmp/pkg && rustup default stable >/dev/null 2>&1 || true; makepkg -f --noconfirm'
          cp /tmp/pkg/*.pkg.tar.* dist/
      - name: Build the generic tarball
        run: scripts/make-release-tarball.sh "$VERSION" dist
      - name: Verify packaged binaries
        env:
          OVERLOOK_GOOGLE_CLIENT_ID: ${{ secrets.OVERLOOK_GOOGLE_CLIENT_ID }}
          OVERLOOK_GOOGLE_CLIENT_SECRET: ${{ secrets.OVERLOOK_GOOGLE_CLIENT_SECRET }}
        run: |
          extracted=$(mktemp)
          trap 'rm -f "$extracted"' EXIT
          bsdtar -xOf "dist/overlook-$VERSION-1-x86_64.pkg.tar.zst" usr/bin/overlook > "$extracted"
          bash scripts/check-release-binary.sh "$extracted"
          tar -xOf "dist/overlook-$VERSION-x86_64-linux.tar.gz" "overlook-$VERSION-x86_64-linux/overlook" > "$extracted"
          bash scripts/check-release-binary.sh "$extracted"
      - name: Include the installer
        run: cp install.sh dist/
      - uses: actions/upload-artifact@v4
        with:
          name: overlook-release-linux
          path: dist/
          if-no-files-found: error

  macos:
    name: Build Mac release package (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - { runner: macos-15, arch: arm64 }
          - { runner: macos-15-intel, arch: x86_64 }
    steps:
      - uses: actions/checkout@v4
      - name: Set up the Metal compiler
        run: |
          if ! xcrun metal --version; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          xcrun metal --version
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.arch }}
      - name: Build and package Overlook
        env:
          OVERLOOK_GOOGLE_CLIENT_ID: ${{ secrets.OVERLOOK_GOOGLE_CLIENT_ID }}
          OVERLOOK_GOOGLE_CLIENT_SECRET: ${{ secrets.OVERLOOK_GOOGLE_CLIENT_SECRET }}
        run: |
          [ "$(uname -m)" = "${{ matrix.arch }}" ]
          cargo build --release --locked -p overlook
          version="${GITHUB_REF_NAME#v}"
          bash scripts/make-macos-archive.sh "$version" dist
          extracted=$(mktemp -d)
          trap 'rm -rf "$extracted"' EXIT
          ditto -x -k "dist/overlook-$version-${{ matrix.arch }}-macos.zip" "$extracted"
          bash scripts/check-release-binary.sh "$extracted/Overlook.app/Contents/MacOS/overlook"
      - uses: actions/upload-artifact@v4
        with:
          name: overlook-release-macos-${{ matrix.arch }}
          path: dist/*.zip
          if-no-files-found: error

  publish:
    name: Publish release and checksums
    needs: [linux, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: overlook-release-*
          merge-multiple: true
          path: dist
      - name: Generate checksums
        run: |
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          cd dist
          sha256sum -- *.pkg.tar.* *.tar.gz *.zip > SHA256SUMS
          cat SHA256SUMS
      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          name: Overlook ${{ env.VERSION }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*
  supply-chain:
    name: Supply-chain scan
    needs: publish
    permissions:
      contents: write
    uses: ./.github/workflows/supply-chain.yml
    with:
      tag: ${{ github.ref_name }}
