name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    name: Build packages and publish
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install toolchain and libraries
        run: |
          pacman -Syu --noconfirm git rustup vulkan-icd-loader libxkbcommon libxkbcommon-x11 libxcb wayland fontconfig freetype2 openssl pkgconf xdg-desktop-portal chromium sudo
          rustup default stable
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Check that the tag matches Cargo.toml
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          CARGO=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          echo "tag=$TAG cargo=$CARGO"
          [ "$TAG" = "$CARGO" ] || { echo "Tag v$TAG does not match Cargo.toml version $CARGO"; exit 1; }
          echo "VERSION=$TAG" >> "$GITHUB_ENV"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # A release never ships with a known-vulnerable Rust dependency. The report is
      # published with the release as evidence of the scan.
      - name: Dependency audit (RustSec)
        run: |
          mkdir -p dist
          cargo audit --json > dist/cargo-audit.json || true
          cargo audit
      - uses: Swatinem/rust-cache@v2
      - name: Build release binary
        run: cargo build --release --locked -p overlook
      - name: Build the pacman package
        run: |
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          mkdir -p /tmp/pkg && cp packaging/PKGBUILD /tmp/pkg/
          cp -r "$GITHUB_WORKSPACE" /tmp/src && chown -R builder /tmp/pkg /tmp/src
          # Reuse the compiled target directory so makepkg does not rebuild from scratch.
          sudo -u builder env OVERLOOK_SRC=/tmp/src CARGO_HOME=/home/builder/.cargo RUSTUP_HOME=/root/.rustup PATH="/root/.cargo/bin:$PATH" bash -c 'cd /tmp/pkg && rustup default stable >/dev/null 2>&1 || true; makepkg -f --noconfirm'
          cp /tmp/pkg/*.pkg.tar.* dist/
      - name: Build the generic tarball
        run: scripts/make-release-tarball.sh "$VERSION" dist
      - name: Checksums and installer
        run: |
          cp install.sh dist/
          cd dist && sha256sum *.pkg.tar.* *.tar.gz > SHA256SUMS && cat SHA256SUMS
      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          name: Overlook ${{ env.VERSION }}
          generate_release_notes: true
          files: |
            dist/*
  supply-chain:
    name: Supply-chain scan
    needs: release
    uses: ./.github/workflows/supply-chain.yml
    with:
      tag: ${{ github.ref_name }}
