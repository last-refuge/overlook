[package]
name = "overlook"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Overlook: a clear view of what matters. A native Linux mail client by Last Refuge."

[[bin]]
name = "overlook"
path = "src/main.rs"

[dependencies]
overlook-core = { workspace = true }
overlook-store = { workspace = true }
overlook-provider = { workspace = true }
gpui-kit = "0.7.3"
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
directories = { workspace = true }
oo7 = "0.4"
notify-rust = "4"
ureq = { version = "3", features = ["json"] }
sha2 = "0.10"
url = "2"
base64 = "0.22"
libc = "0.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
ksni = { version = "0.3.7", features = ["blocking"] }

[dev-dependencies]
tempfile = "3"
overlook-provider = { workspace = true, features = ["fake-servers"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
