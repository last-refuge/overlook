[package]
name = "overlook-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Overlook domain model: accounts, messages, conversations, drafts, pending operations, appearance."

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
ammonia = { workspace = true }
# Named-color lookup only; no stylesheet engine.
cssparser = { version = "0.38", default-features = false }
jiff = { workspace = true }
html5ever = "0.27"
markup5ever_rcdom = "0.3"
markdown = "1.0"
url = "2"
# Decodes the images a pasted signature carries as data: URLs.
base64 = "0.22"
# Reads .tar.gz attachments for the outgoing attachment policy.
flate2 = "1"
